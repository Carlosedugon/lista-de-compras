name: Gerar APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:      # permite rodar na mão pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O SDK do Android já vem instalado no runner do GitHub.
      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lista-de-compras-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Se a build veio de uma tag (ex.: v1.0), publica o APK numa Release,
      # que dá um link direto de download — fácil de abrir no celular.
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
