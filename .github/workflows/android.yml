name: Gerar APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # O index.html da raiz é a única fonte da verdade: o que vai para o
      # GitHub Pages e o que fica dentro do app como cópia offline.
      - name: Copiar a página para dentro do app
        run: cp index.html app/src/main/assets/index.html

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lista-de-compras-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
