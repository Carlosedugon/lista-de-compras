<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17352C">
<title>Lista de compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EDF0E8;
    --card:#FFFFFF;
    --pine:#17352C;
    --pine-soft:#24473C;
    --ink:#13211C;
    --muted:#6C7A70;
    --line:#CBD3C6;
    --tomate:#E2503B;
    --broto:#B7D06B;
    --marca:#17352C;
    --raio:12px;
    --borda:1px;
    --sombra:none;
    --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
    --titulo:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  }

  /* ---------- visual pixel ---------- */
  body[data-tema="pixel"]{
    --paper:#DFF6E0;
    --card:#FFFFFF;
    --pine:#2B3FA0;
    --pine-soft:#3A51BE;
    --ink:#1B2A6B;
    --muted:#6675A8;
    --line:#B9C4E8;
    --tomate:#E8453C;
    --broto:#FFD23F;
    --marca:#2B3FA0;
    --raio:0px;
    --borda:2px;
    --sombra:4px 4px 0 rgba(27,42,107,.2);
    --titulo:"Press Start 2P","Courier New",monospace;
    background:linear-gradient(#BFE9FF 0%, #DFF6E0 60%);
    background-attachment:fixed;
  }
  body[data-tema="pixel"]::before{
    content:"";position:fixed;left:0;right:0;bottom:0;height:96px;z-index:0;pointer-events:none;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='24' shape-rendering='crispEdges'><rect x='0' y='16' width='32' height='8' fill='%2357B05A'/><rect x='0' y='12' width='4' height='4' fill='%2357B05A'/><rect x='8' y='8' width='4' height='8' fill='%236FC96B'/><rect x='12' y='12' width='4' height='4' fill='%2357B05A'/><rect x='20' y='10' width='4' height='6' fill='%236FC96B'/><rect x='26' y='13' width='4' height='3' fill='%2357B05A'/></svg>") repeat-x bottom;
    background-size:64px 48px;
    image-rendering:pixelated;
  }
  body[data-tema="pixel"] .app{position:relative;z-index:1}
  body[data-tema="pixel"] .tape::after{
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='8' shape-rendering='crispEdges'><rect x='0' y='0' width='8' height='8' fill='%232B3FA0'/></svg>") repeat-x;
    background-size:16px 8px;height:8px;bottom:-8px;
  }
  body[data-tema="pixel"] .cat-name,
  body[data-tema="pixel"] .eyebrow,
  body[data-tema="pixel"] .total-label{font-size:11px;line-height:1.6;letter-spacing:0}
  body[data-tema="pixel"] .check{border-width:2px;border-radius:0}
  body[data-tema="pixel"] .empty strong{font-size:13px;line-height:1.8}

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding:20px 18px 90px;
  }
  .app{max-width:720px;margin:0 auto}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--tomate);outline-offset:2px}

  /* ---------- barra do dia ---------- */
  .statusbar{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:8px 12px;margin-bottom:12px;
  }
  .statusbar .pisca{
    flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .2s;
  }
  .statusbar.ok .pisca{background:#3E9B54}
  .statusbar.erro .pisca{background:var(--tomate)}
  .statusbar.off .pisca{background:#E0A030}
  .statusbar .txt{
    flex:1;text-align:left;background:none;border:none;padding:0;color:var(--muted);
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  }
  .statusbar.erro .txt{color:var(--tomate)}
  .statusbar .salvar{
    background:none;border:none;color:var(--marca);padding:2px 0;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  }
  .statusbar .salvar:hover{text-decoration:underline}
  .log{
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:12px;margin-bottom:12px;
  }
  .log h4{
    margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);font-weight:400;
    display:flex;align-items:center;gap:10px;
  }
  .log h4 button{
    margin-left:auto;background:none;border:none;color:var(--marca);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  }
  .log ul{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;display:grid;gap:1px}
  .log li{display:flex;gap:9px;align-items:baseline;padding:5px 2px;font-size:13px;border-bottom:1px dotted var(--line)}
  .log li:last-child{border-bottom:none}
  .log li i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted);position:relative;top:-1px}
  .log li.ok i{background:#3E9B54}
  .log li.erro i{background:var(--tomate)}
  .log li.aviso i{background:#E0A030}
  .log li time{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .erro-salvar{
    background:#FDECEA;border:1px solid var(--tomate);color:#8A2A1E;
    border-radius:var(--raio);padding:10px 12px;margin-bottom:12px;font-size:14px;
  }
  .topbar{display:flex;gap:10px;margin-bottom:12px}
  .dia{
    flex:1;display:flex;align-items:center;gap:9px;
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:11px 13px;text-align:left;color:var(--ink);
  }
  .dia svg{flex:none;width:16px;height:16px;stroke:var(--marca);fill:none;stroke-width:1.8}
  .dia b{font-weight:600;text-transform:capitalize}
  .dia .chev{margin-left:auto;color:var(--muted);font-size:11px}
  .tema{
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:0 13px;color:var(--marca);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  }
  .tema:hover,.dia:hover{border-color:var(--marca)}

  /* ---------- calendário ---------- */
  .cal{
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:14px;margin-bottom:16px;
  }
  .cal-aviso{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--paper);border:var(--borda) solid var(--marca);border-radius:var(--raio);
    padding:10px 12px;margin-bottom:12px;font-size:14px;
  }
  .cal-aviso b{font-weight:600}
  .cal-aviso button{
    margin-left:auto;background:none;border:none;color:var(--muted);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  }
  .cal-aviso button:hover{color:var(--tomate)}
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .cal-head strong{
    flex:1;text-align:center;font-family:var(--titulo);font-size:15px;text-transform:capitalize;
  }
  .cal-head button{
    width:32px;height:32px;border:var(--borda) solid var(--line);border-radius:var(--raio);
    background:var(--card);color:var(--ink);line-height:1;
  }
  .cal-head button:hover{border-color:var(--marca)}
  .cal-sem,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-sem span{
    text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    color:var(--muted);text-transform:uppercase;padding-bottom:4px;
  }
  .cal-cel{
    position:relative;aspect-ratio:1;border:var(--borda) solid transparent;border-radius:var(--raio);
    background:transparent;color:var(--ink);font-family:var(--mono);font-size:14px;padding:0;
  }
  .cal-cel:hover{background:var(--paper)}
  .cal-cel.hoje{border-color:var(--line);font-weight:600}
  .cal-cel.sel{background:var(--pine);color:var(--card);border-color:var(--pine)}
  .cal-cel.tem::after{
    content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;
    border-radius:50%;background:var(--tomate);
  }
  .cal-cel.sel.tem::after{background:var(--broto)}
  .cal-foot{margin-top:12px;display:flex;justify-content:center}
  .cal-foot button,.salvas button{
    background:none;border:none;color:var(--marca);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px;
  }
  .salvas{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .salvas h4{
    margin:0 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);font-weight:400;
  }
  .salvas ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  .salvas li button{
    display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;
    padding:7px 8px;border-radius:var(--raio);text-transform:none;letter-spacing:0;
    font-family:var(--body);font-size:14px;color:var(--ink);
  }
  .salvas li button:hover{background:var(--paper)}
  .salvas li button.atual{background:var(--paper);font-weight:600}
  .salvas li span{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .salvas .vazio{color:var(--muted);font-size:14px;padding:4px 8px}

  /* ---------- fita de caixa ---------- */
  .tape{
    position:relative;background:var(--pine);color:#fff;
    border-radius:var(--raio) var(--raio) 0 0;padding:18px 20px 20px;margin-bottom:32px;
  }
  .tape::after{
    content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='12'><path d='M0 0 L9 12 L18 0 Z' fill='%2317352C'/></svg>") repeat-x;
    background-size:18px 12px;
  }
  .tape-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.72;
  }
  .budget{display:flex;align-items:center;gap:8px}
  .budget span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
  .budget input{
    width:100px;background:transparent;border:none;border-bottom:1.5px dashed rgba(255,255,255,.35);
    color:#fff;font-family:var(--mono);font-size:14px;text-align:right;padding:2px 4px;
  }
  .budget input::placeholder{color:rgba(255,255,255,.45)}
  .total-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
  .total-label{font-family:var(--titulo);font-weight:600;font-size:19px}
  .total-value{
    font-family:var(--mono);font-weight:600;font-size:clamp(32px,9.5vw,50px);
    letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1;
  }
  .meter{height:5px;background:rgba(255,255,255,.2);border-radius:99px;margin:15px 0 10px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--broto);transition:width .35s ease}
  .meter.over i{background:var(--tomate)}
  .tape-meta{display:flex;gap:5px 18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;opacity:.75}
  .tape-meta b{font-weight:500;opacity:1}

  /* ---------- formulário ---------- */
  .add{
    display:grid;grid-template-columns:1fr 108px 96px;gap:10px;
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:12px;margin-bottom:28px;
  }
  .add .field{display:flex;flex-direction:column;gap:3px}
  .add .field.wide{grid-column:1 / -1}
  .add label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .add input,.add select{
    width:100%;border:none;border-bottom:1.5px solid var(--line);background:transparent;padding:5px 2px;font-size:16px;
  }
  .add input:focus,.add select:focus{border-bottom-color:var(--marca);outline:none}
  .add select{appearance:none;background:transparent}
  .add .money input{font-family:var(--mono);text-align:right}
  .add button[type="submit"]{
    grid-column:1 / -1;background:var(--pine);color:#fff;border:none;border-radius:var(--raio);
    padding:12px;font-weight:600;
  }
  .add button[type="submit"]:hover{background:var(--pine-soft)}

  /* ---------- combo de produto ---------- */
  .combo{position:relative}
  .combo input{padding-right:26px !important}
  .arrow{
    position:absolute;right:0;bottom:2px;width:24px;height:24px;padding:0;
    background:none;border:none;color:var(--muted);font-size:11px;line-height:1;transition:transform .15s ease;
  }
  .combo.open .arrow{transform:rotate(180deg);color:var(--ink)}
  .sugg{
    display:none;position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;
    max-height:330px;overflow-y:auto;margin:0;padding:0 5px 5px;
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);
    box-shadow:0 10px 26px rgba(19,33,28,.14);
  }
  .combo.open .sugg{display:block}
  .sugg ul{list-style:none;margin:0;padding:0}
  .busca{
    position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;gap:8px;
    padding:9px 8px;margin:0 -5px 5px;border-bottom:1px solid var(--line);
  }
  .busca svg{flex:none;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
  .busca input{width:100%;border:none;background:transparent;font-size:15px;padding:2px 0}
  .busca input:focus{outline:none}
  .sugg li{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:8px 10px;border-radius:var(--raio);cursor:pointer;
  }
  .sugg li[data-on="1"],.sugg li:hover{background:var(--paper)}
  .sugg li small{
    flex:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  }
  .sugg .none{color:var(--muted);cursor:default;font-size:14px}
  .sugg-foot{
    position:sticky;bottom:0;background:var(--card);padding-top:5px;margin:5px -5px -5px;border-top:1px solid var(--line);
  }
  .link-btn{
    display:block;width:100%;text-align:left;background:none;border:none;padding:10px;
    border-radius:var(--raio);color:var(--marca);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  }
  .link-btn:hover{background:var(--paper)}
  .novo{display:grid;gap:8px;padding:6px 10px 10px}
  .novo input,.novo select{
    width:100%;border:var(--borda) solid var(--line);border-radius:var(--raio);padding:9px;font-size:15px;background:var(--card);
  }
  .novo button{background:var(--pine);color:#fff;border:none;border-radius:var(--raio);padding:10px;font-weight:600}
  .novo button:hover{background:var(--pine-soft)}

  /* ---------- lista ---------- */
  .cat{margin-bottom:28px}
  .cat-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
  .cat-name{font-family:var(--titulo);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
  .cat-count{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .cat-sum{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  ul{list-style:none;margin:0;padding:0}
  .item{padding:11px 0;border-bottom:1px dotted var(--line)}
  .row{display:flex;align-items:baseline;gap:8px}
  .check{
    flex:none;width:19px;height:19px;border:1.5px solid var(--muted);border-radius:5px;
    background:transparent;padding:0;position:relative;top:3px;transition:.15s;
  }
  .check::after{
    content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .15s ease;
  }
  .item.done .check{background:var(--pine);border-color:var(--pine)}
  .item.done .check::after{transform:rotate(45deg) scale(1)}
  .name{font-weight:500}
  .leader{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:14px}
  .sub{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .item.done .name,.item.done .sub{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .controls{display:flex;align-items:center;gap:14px;margin:7px 0 0 27px;flex-wrap:wrap}
  .qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--raio);overflow:hidden}
  .qty button{width:26px;height:26px;border:none;background:var(--card);color:var(--muted);font-size:15px;line-height:1}
  .qty button:hover{background:var(--paper);color:var(--ink)}
  .qty span{
    min-width:26px;text-align:center;font-family:var(--mono);font-size:13px;
    border-left:1px solid var(--line);border-right:1px solid var(--line);height:26px;line-height:26px;
  }
  .price{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .price input{
    width:74px;border:none;border-bottom:1px dashed var(--line);background:transparent;
    font-family:var(--mono);font-size:13px;text-align:right;padding:2px;
  }
  .price input:focus{border-bottom-color:var(--marca);outline:none;color:var(--ink)}
  .del{
    margin-left:auto;background:none;border:none;padding:2px 0;color:var(--muted);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  }
  .del:hover{color:var(--tomate)}

  .empty{
    border:1.5px dashed var(--line);border-radius:var(--raio);padding:32px 22px;text-align:center;
    color:var(--muted);background:var(--card);
  }
  .empty strong{display:block;font-family:var(--titulo);font-weight:600;font-size:18px;color:var(--ink);margin-bottom:6px}
  .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
  .foot button{
    background:var(--card);border:var(--borda) solid var(--line);border-radius:var(--raio);padding:9px 14px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }
  .foot button:hover{border-color:var(--ink);color:var(--ink)}

  @media (max-width:520px){
    body{padding:14px 12px 70px}
    .add{grid-template-columns:1fr 1fr}
    .add .field.cat-field{grid-column:1 / -1}
    .controls{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<body data-tema="classico">
<div class="app">

  <div class="topbar">
    <button class="dia" id="btnDia" type="button" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
      <b id="diaTxt">—</b>
      <span class="chev">▼</span>
    </button>
    <button class="tema" id="btnTema" type="button">Pixel</button>
  </div>

  <div class="statusbar" id="statusbar">
    <span class="pisca"></span>
    <button class="txt" type="button" id="statusTxt" aria-expanded="false">Carregando…</button>
    <button class="salvar" type="button" id="btnSalvar">Salvar agora</button>
  </div>

  <div class="log" id="log" hidden>
    <h4>Registro <button type="button" id="copiarLog">Copiar</button></h4>
    <ul id="logLista"></ul>
  </div>

  <div class="cal" id="cal" hidden>
    <div class="cal-aviso" id="calAviso" hidden>
      <span><b>Copiar lista:</b> toque no dia de destino.</span>
      <button type="button" id="cancelaCopia">Cancelar</button>
    </div>
    <div class="cal-head">

<script>
/* Fora do ambiente do Claude não existe window.storage: aqui ela é atendida
   pelo localStorage do navegador (vale para o site e para o app Android). */
if(!window.storage){
  window.storage = {
    async get(k){
      const v = localStorage.getItem(k);
      if(v === null) throw new Error("chave inexistente: " + k);
      return { key:k, value:v, shared:false };
    },
    async set(k, v){ localStorage.setItem(k, v); return { key:k, value:v, shared:false }; },
    async delete(k){ localStorage.removeItem(k); return { key:k, deleted:true, shared:false }; },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared:false };
    }
  };
}
</script>

/* ---------- datas ---------- */
const hojeISO = () => iso(new Date());
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function daISO(s){
  const [a,m,d] = s.split("-").map(Number);
  return new Date(a, m-1, d);
}
const fmtLongo = new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"numeric",month:"long"});

/* ---------- estado ---------- */
let state = { tema:"classico", data:hojeISO(), listas:{}, cats:[], catalogo:[] };
let mesVisivel = new Date();

function lista(){
  if(!state.listas[state.data]) state.listas[state.data] = { budget:0, items:[] };
  return state.listas[state.data];
}
function cats(){
  const fixas = CATS_BASE.filter(c => c !== "Outros");
  return fixas.concat(state.cats.filter(c => !CATS_BASE.includes(c)), ["Outros"]);
}
function catalogo(){
  const vistos = new Set();
  return state.catalogo.concat(CATALOGO).filter(([n]) => {
    const k = n.toLowerCase();
    if(vistos.has(k)) return false;
    vistos.add(k); return true;
  });
}
function datasSalvas(){
  return Object.keys(state.listas)
    .filter(d => state.listas[d].items.length)
    .sort().reverse();
}
function totalDe(d){
  const l = state.listas[d];
  return l ? l.items.reduce((s,i) => s + i.price*i.qty, 0) : 0;
}

/* ---------- registro e status ---------- */
const LOG = [];
const hora = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + ":" + String(d.getSeconds()).padStart(2,"0");

function logar(tipo, msg){
  const agora = new Date();
  const ultimo = LOG[0];
  // gravações seguidas viram uma linha só, com contador, para o registro não virar poluição
  if(ultimo && ultimo.tipo === tipo && ultimo.msg === msg && agora - ultimo.quando < 60000){
    ultimo.vezes++;
    ultimo.quando = agora;
  }else{
    LOG.unshift({ tipo, msg, quando: agora, vezes: 1 });
    if(LOG.length > 40) LOG.pop();
  }
  renderStatus();
}

function renderStatus(){
  const bar = $("statusbar");
  const ultimo = LOG[0];
  bar.classList.remove("ok","erro","off");
  if(ultimo){
    bar.classList.add(ultimo.tipo === "erro" ? "erro" : ultimo.tipo === "aviso" ? "off" : "ok");
    $("statusTxt").textContent = hora(ultimo.quando) + "  " + ultimo.msg + (ultimo.vezes > 1 ? " (" + ultimo.vezes + "x)" : "");
  }
  if($("log").hidden) return;

  const ul = $("logLista");
  ul.innerHTML = "";
  LOG.forEach(l => {
    const li = document.createElement("li");
    li.className = l.tipo;
    li.innerHTML = `<i></i><time>${hora(l.quando)}</time><span>${escapeHtml(l.msg)}${l.vezes>1 ? " ("+l.vezes+"x)" : ""}</span>`;
    ul.appendChild(li);
  });
}

/* ---------- persistência ---------- */
async function save(){
  // não guarda dias abertos sem nada dentro
  for(const d of Object.keys(state.listas)){
    const l = state.listas[d];
    if(d !== state.data && !l.items.length && !l.budget) delete state.listas[d];
  }
  try{
    await window.storage.set(KEY, JSON.stringify(state));
    const n = lista().items.length;
    logar("ok", "Lista gravada no aparelho (" + n + (n === 1 ? " item)" : " itens)"));
  }catch(e){
    console.warn("Não deu para salvar:", e);
    logar("erro", "Falha ao gravar: " + (e && e.message ? e.message : "armazenamento bloqueado"));
  }
}
async function load(){
  let raw = null;
  try{ const r = await window.storage.get(KEY); raw = r && r.value; }catch(e){}

  if(raw){
    try{
      const d = JSON.parse(raw);
      state = {
        tema: d.tema === "pixel" ? "pixel" : "classico",
        data: d.data || hojeISO(),
        listas: d.listas && typeof d.listas === "object" ? d.listas : {},
        cats: Array.isArray(d.cats) ? d.cats : [],
        catalogo: Array.isArray(d.catalogo) ? d.catalogo : []
      };
      logar("ok", "Dados carregados do aparelho (" + Object.keys(state.listas).length + " dia(s) salvo(s))");
      return;
    }catch(e){
      logar("erro", "Dados guardados estavam corrompidos; recomeçando");
    }
  }
  logar("aviso", "Primeira abertura: carregando a lista inicial");
  // primeira vez: já entra com a lista do dia 4
  state.data = SEED_DATA;
  state.listas[SEED_DATA] = {
    budget: SEED_BUDGET,
    items: SEED_ITENS.map(([name,cat,price,qty]) => ({ id:novoId(), name, price, qty, cat, done:false }))
  };
  state.catalogo = SEED_CATALOGO.slice();
  save();
}

/* ---------- calendário ---------- */
let modoCopia = false;

function renderCalendario(){
  $("calAviso").hidden = !modoCopia;
  const ano = mesVisivel.getFullYear(), mes = mesVisivel.getMonth();
  $("mesTxt").textContent = fmtMes.format(mesVisivel);

  const primeiro = new Date(ano, mes, 1).getDay();
  const dias = new Date(ano, mes+1, 0).getDate();
  const grid = $("calGrid");
  grid.innerHTML = "";

  for(let i=0; i<primeiro; i++) grid.appendChild(document.createElement("span"));

  for(let d=1; d<=dias; d++){
    const chave = iso(new Date(ano, mes, d));
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cal-cel";
    b.textContent = d;
    if(chave === hojeISO()) b.classList.add("hoje");
    if(chave === state.data) b.classList.add("sel");
    if(state.listas[chave] && state.listas[chave].items.length){
      b.classList.add("tem");
      b.title = brl(totalDe(chave));
    }
    b.addEventListener("click", () => {
      if(modoCopia){ copiarPara(chave); return; }
      state.data = chave;
      fecharCalendario();
      commit();
    });
    grid.appendChild(b);
  }

  const datas = datasSalvas();
  const box = $("salvas");
  if(!datas.length){
    box.innerHTML = `<h4>Listas salvas</h4><p class="vazio">Nenhuma lista guardada ainda.</p>`;
    return;
  }
  box.innerHTML = `<h4>Listas salvas</h4><ul></ul>`;
  const ul = box.querySelector("ul");
  datas.slice(0,10).forEach(d => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    if(d === state.data) b.className = "atual";
    b.innerHTML = `${fmtCurto.format(daISO(d))} <span>${brl(totalDe(d))}</span>`;
    b.addEventListener("click", () => {
      if(modoCopia){ copiarPara(d); return; }
      state.data = d;
      mesVisivel = daISO(d);
      fecharCalendario();
      commit();
    });
    li.appendChild(b);
    ul.appendChild(li);
  });
}

function abrirCalendario(){

/* ---------- totais e lista ---------- */
function parseMoney(v){
  if(typeof v === "number") return v;
  let s = String(v).replace(/[^\d,.-]/g,"").trim();
  if(!s) return 0;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : Math.max(0,n);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function totals(){
  let all=0, done=0, count=0;
  for(const it of lista().items){
    const v = it.price * it.qty;
    all += v; count += it.qty;
    if(it.done) done += v;
  }
  return {all, done, left: all-done, count};
}

function render(){
  const l = lista(), t = totals();

  $("diaTxt").textContent = fmtLongo.format(daISO(state.data));
  $("tapeData").textContent = state.data === hojeISO() ? "Compras de hoje" : "Compras de " + fmtCurto.format(daISO(state.data));
  $("budget").value = l.budget ? l.budget.toFixed(2).replace(".",",") : "";

  $("total").textContent = brl(t.all);
  $("mItems").textContent = l.items.length === 0 ? "Nenhum item"
    : `${l.items.length} produto${l.items.length>1?"s":""} · ${t.count} unidade${t.count>1?"s":""}`;
  $("mCart").innerHTML = `No carrinho <b>${brl(t.done)}</b>`;
  $("mLeft").innerHTML = l.budget > 0
    ? `Sobra do orçamento <b>${brl(l.budget - t.all)}</b>`
    : `Falta pegar <b>${brl(t.left)}</b>`;

  const base = l.budget > 0 ? l.budget : t.all;
  const pct = base > 0 ? Math.min(100, (l.budget>0 ? t.all : t.done)/base*100) : 0;
  $("meterFill").style.width = pct + "%";
  $("meter").classList.toggle("over", l.budget>0 && t.all>l.budget);

  const box = $("list");
  box.innerHTML = "";

  if(!l.items.length){
    box.innerHTML = `<div class="empty"><strong>Nada nesta data ainda</strong>
      Adicione um produto acima, ou escolha outro dia no calendário.</div>`;
    return;
  }

  for(const cat of cats()){
    const items = l.items.filter(i => i.cat === cat);
    if(!items.length) continue;
    const sum = items.reduce((s,i) => s + i.price*i.qty, 0);

    const sec = document.createElement("section");
    sec.className = "cat";
    sec.innerHTML = `<div class="cat-head">
        <span class="cat-name">${escapeHtml(cat)}</span>
        <span class="cat-count">${items.length} ${items.length>1?"itens":"item"}</span>
        <span class="cat-sum">${brl(sum)}</span>
      </div><ul></ul>`;
    const ul = sec.querySelector("ul");

    for(const it of items){
      const li = document.createElement("li");
      li.className = "item" + (it.done ? " done" : "");
      li.innerHTML = `
        <div class="row">
          <button class="check" data-act="done" aria-label="Marcar ${escapeHtml(it.name)} como comprado" aria-pressed="${it.done}"></button>
          <span class="name">${escapeHtml(it.name)}</span>
          <span class="leader"></span>
          <span class="sub">${brl(it.price*it.qty)}</span>
        </div>
        <div class="controls">
          <div class="qty">
            <button data-act="minus" aria-label="Diminuir quantidade">−</button>
            <span>${it.qty}</span>
            <button data-act="plus" aria-label="Aumentar quantidade">+</button>
          </div>
          <label class="price">R$ <input data-act="price" inputmode="decimal"
            value="${it.price.toFixed(2).replace(".",",")}" aria-label="Valor unitário de ${escapeHtml(it.name)}"></label>
          <button class="del" data-act="del">Remover</button>
        </div>`;
      li.addEventListener("click", e => {
        const act = e.target.dataset && e.target.dataset.act;
        if(!act || act === "price") return;
        if(act === "done") it.done = !it.done;
        if(act === "plus") it.qty++;
        if(act === "minus") it.qty = Math.max(1, it.qty-1);
        if(act === "del") l.items = l.items.filter(x => x.id !== it.id);
        state.listas[state.data] = l;
        commit();
      });
      li.querySelector('[data-act="price"]').addEventListener("change", e => {
        it.price = parseMoney(e.target.value);
        commit();
      });
      ul.appendChild(li);
    }
    box.appendChild(sec);
  }
}

function commit(){ render(); if(!$("cal").hidden) renderCalendario(); save(); }

/* ---------- sugestões de produto ---------- */
const combo = $("combo"), sugg = $("sugg"), suggList = $("suggList");
const fName = $("fName"), fSearch = $("fSearch");
let marcado = -1, visiveis = [];
const semAcento = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

function filtrar(termo){
  const t = semAcento(termo || "").trim();
  const base = catalogo();
  visiveis = t ? base.filter(([n,c]) => semAcento(n).includes(t) || semAcento(c).includes(t)) : base;
  suggList.innerHTML = "";
  marcado = -1;

  if(!visiveis.length){
    const li = document.createElement("li");
    li.className = "none";
    li.textContent = "Nada encontrado. Cadastre esse produto ali embaixo.";
    suggList.appendChild(li);
    return;
  }
  visiveis.forEach(([n,c], i) => {
    const li = document.createElement("li");
    li.setAttribute("role","option");
    li.dataset.i = i;
    li.innerHTML = `<span>${escapeHtml(n)}</span><small>${escapeHtml(c)}</small>`;
    li.addEventListener("mousedown", e => { e.preventDefault(); escolher(i); });
    suggList.appendChild(li);
  });
}
function abrirSugestoes(termo, focarBusca){
  fSearch.value = termo || "";
  filtrar(fSearch.value);
  combo.classList.add("open");
  fName.setAttribute("aria-expanded","true");
  sugg.scrollTop = 0;
  if(focarBusca) fSearch.focus();
}
function fecharSugestoes(){
  combo.classList.remove("open");
  fName.setAttribute("aria-expanded","false");
  esconderNovo();
  marcado = -1;
}
function marcar(i){
  const lis = suggList.querySelectorAll("li[data-i]");
  if(!lis.length) return;
  marcado = (i + lis.length) % lis.length;
  lis.forEach(li => li.removeAttribute("data-on"));
  const alvo = lis[marcado];
  alvo.setAttribute("data-on","1");
  alvo.scrollIntoView({block:"nearest"});
}
function escolher(i){
  const item = visiveis[i];
  if(!item) return;
  fName.value = item[0];
  $("fCat").value = cats().includes(item[1]) ? item[1] : "Outros";
  fecharSugestoes();
  $("fPrice").focus();
}
function navegar(e){
  const aberto = combo.classList.contains("open");
  if(e.key === "ArrowDown"){
    e.preventDefault();
    if(!aberto) abrirSugestoes(fName.value, false);
    marcar(marcado + 1);
  }else if(e.key === "ArrowUp"){
    e.preventDefault();
    if(aberto) marcar(marcado - 1);
  }else if(e.key === "Enter" && aberto && marcado >= 0){
    e.preventDefault();
    escolher(marcado);
  }else if(e.key === "Escape" && aberto){
    e.preventDefault();
    fecharSugestoes();
    fName.focus();
  }
}
$("fNameToggle").addEventListener("click", () => {
  if(combo.classList.contains("open")) fecharSugestoes();
  else abrirSugestoes("", true);
});
fName.addEventListener("input", () => abrirSugestoes(fName.value, false));
fName.addEventListener("keydown", navegar);
fSearch.addEventListener("input", () => filtrar(fSearch.value));
fSearch.addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); if(marcado < 0) marcar(0); else escolher(marcado); }
  else navegar(e);
});
document.addEventListener("click", e => {
  if(!combo.contains(e.target)) fecharSugestoes();
});

/* ---------- cadastrar produto novo ---------- */
function mostrarNovo(){
  $("novoProd").hidden = false;
  $("novoProdBtn").hidden = true;
  $("npName").value = fSearch.value.trim() || fName.value.trim();
  $("npCat").value = $("fCat").value;
  $("npNewCat").hidden = true;
  $("npNewCat").value = "";
  $("npName").focus();
}
function esconderNovo(){
  $("novoProd").hidden = true;
  $("novoProdBtn").hidden = false;
}
$("novoProdBtn").addEventListener("click", mostrarNovo);
$("npCat").addEventListener("change", () => {
  const nova = $("npCat").value === "__nova";
  $("npNewCat").hidden = !nova;
  if(nova) $("npNewCat").focus();
});
function salvarNovoProduto(){
  const nome = $("npName").value.trim();
  if(!nome){ $("npName").focus(); return; }
  let cat = $("npCat").value;
  if(cat === "__nova"){
    cat = $("npNewCat").value.trim();
    if(!cat){ $("npNewCat").focus(); return; }
    const igual = cats().find(c => c.toLowerCase() === cat.toLowerCase());
    if(igual) cat = igual;
    else { state.cats.push(cat); popularCategorias(); }
  }
  if(!catalogo().some(([n]) => n.toLowerCase() === nome.toLowerCase())) state.catalogo.unshift([nome, cat]);
  save();
  fName.value = nome;
  $("fCat").value = cat;
  fecharSugestoes();
  $("fPrice").focus();
}
$("npSave").addEventListener("click", salvarNovoProduto);
$("npName").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); salvarNovoProduto(); } });
$("npNewCat").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); salvarNovoProduto(); } });

/* ---------- eventos gerais ---------- */
$("form").addEventListener("submit", e => {
  e.preventDefault();
  fecharSugestoes();
  const name = fName.value.trim();
  if(!name) return;
  lista().items.push({
    id: novoId(),
    name,
    price: parseMoney($("fPrice").value),
    qty: Math.max(1, parseInt($("fQty").value,10) || 1),
    cat: $("fCat").value,
    done: false
  });
  fName.value = ""; $("fPrice").value = ""; $("fQty").value = "1";
  fName.focus();
  commit();
});

$("budget").addEventListener("change", e => {
  lista().budget = parseMoney(e.target.value);
  commit();
});

$("clearDone").addEventListener("click", () => {
  lista().items = lista().items.filter(i => !i.done);
  commit();
});

$("clearAll").addEventListener("click", () => {
  if(!lista().items.length || confirm("Apagar todos os itens de " + fmtCurto.format(daISO(state.data)) + "?")){
    state.listas[state.data] = { budget:0, items:[] };
    commit();
  }
});

$("copiar").addEventListener("click", () => {
  if(!lista().items.length){ alert("Este dia está vazio — não há o que copiar."); return; }
  modoCopia = true;
  abrirCalendario();
  $("cal").scrollIntoView({ block:"nearest", behavior:"smooth" });
});

$("cancelaCopia").addEventListener("click", () => {
  modoCopia = false;
  renderCalendario();
});

function copiarPara(alvo){
  const origem = lista();
  const destino = state.listas[alvo] || { budget:0, items:[] };
  origem.items.forEach(i => destino.items.push({ ...i, id:novoId(), done:false }));
  if(!destino.budget) destino.budget = origem.budget;
  state.listas[alvo] = destino;
  modoCopia = false;
  state.data = alvo;
  mesVisivel = daISO(alvo);
  fecharCalendario();
  commit();
}

/* ---------- botões do status ---------- */
$("statusTxt").addEventListener("click", () => {
  const aberto = !$("log").hidden;
  $("log").hidden = aberto;
  $("statusTxt").setAttribute("aria-expanded", String(!aberto));
  renderStatus();
});

$("btnSalvar").addEventListener("click", async () => {
  await save();
  const ultimo = LOG[0];
  if(ultimo && ultimo.tipo === "erro") $("log").hidden = false;
  renderStatus();
});

$("copiarLog").addEventListener("click", async () => {
  const texto = LOG.map(l => hora(l.quando) + "  [" + l.tipo + "] " + l.msg + (l.vezes>1 ? " ("+l.vezes+"x)" : "")).join("\n");
  try{
    await navigator.clipboard.writeText(texto);
    logar("ok", "Registro copiado");
  }catch(e){
    logar("aviso", "Não consegui copiar; selecione o texto na tela");
  }
});

/* ---------- conexão ---------- */
function estadoConexao(inicial){
  if(navigator.onLine){
    if(!inicial) logar("ok", "Conexão restabelecida");
  }else{
    logar("aviso", "Sem conexão — a lista continua sendo salva no aparelho");
  }
}
window.addEventListener("online", () => estadoConexao(false));
window.addEventListener("offline", () => estadoConexao(false));

/* Grava assim que o app sai da frente: fechar pelo multitarefa não pode
   levar embora o que acabou de ser marcado. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") save();
});
window.addEventListener("pagehide", () => save());

(async function init(){
  await load();
  estadoConexao(true);
  aplicarTema();
  popularCategorias();
  mesVisivel = daISO(state.data);
  render();
})();
</script>
</body>
</html>
